<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>SALTMERE</title>
	<style>
		:root { color-scheme: dark; }
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
		body { font-family: "Iowan Old Style", Palatino, Georgia, serif; color: #cfc9be; }
		canvas { display: block; }

		#hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

		/* Interaction prompt — deliberately small and low-contrast. */
		#prompt {
			position: absolute; left: 50%; top: 56%; transform: translateX(-50%);
			font-size: 15px; letter-spacing: .04em; color: #b8b2a6;
			opacity: 0; transition: opacity .18s ease; text-shadow: 0 1px 3px #000;
		}
		#prompt.on { opacity: .85; }

		/* Mara's internal line. Never more than one sentence. */
		#subtitle {
			position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
			max-width: 46ch; text-align: center; font-size: 17px; line-height: 1.5;
			font-style: italic; color: #c9c3b7; opacity: 0;
			transition: opacity 1.1s ease; text-shadow: 0 2px 6px #000;
		}
		#subtitle.on { opacity: .92; }

		#vignette {
			position: absolute; inset: 0;
			background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%);
		}

		/* Fade layer used for blackouts, blinks, and scene transitions. */
		#fade {
			position: absolute; inset: 0; background: #000; opacity: 1;
			transition: opacity 1.6s ease;
		}

		/* ---- title ----
		   The old one was tasteful, which is the wrong register entirely. This
		   is a photograph of a drowned room: something breathing behind the
		   title, water-light crawling on it, and a figure that is only ever
		   almost there. */
		#title {
			position: fixed; inset: 0; display: flex; flex-direction: column;
			align-items: center; justify-content: center; gap: 2.2rem;
			background: #000; z-index: 10; cursor: pointer; overflow: hidden;
		}
		#title canvas.tbg {
			position: absolute; inset: 0; width: 100%; height: 100%;
			z-index: 0; opacity: .92;
		}
		#title .tvig {
			position: absolute; inset: 0; z-index: 1; pointer-events: none;
			background:
				radial-gradient(ellipse at 50% 46%, transparent 18%, rgba(0,0,0,.55) 58%, #000 92%);
		}
		#title > *:not(canvas):not(.tvig) { position: relative; z-index: 2; }

		#title h1 {
			font-size: clamp(2.8rem, 10vw, 6rem); font-weight: 400;
			letter-spacing: .40em; text-indent: .40em;
			color: #cdc4b2;
			text-shadow:
				0 0 1px rgba(220,212,196,.7),
				0 0 26px rgba(140,160,170,.30),
				0 10px 44px rgba(0,0,0,.95);
			animation: tflick 7s infinite steps(1);
		}
		/* Mains-frequency stutter, not a smooth pulse. */
		@keyframes tflick {
			0%,  6%   { opacity: 1;   }
			6.5%      { opacity: .28; }
			7%        { opacity: .95; }
			7.4%      { opacity: .42; }
			8%,  61%  { opacity: 1;   }
			61.6%     { opacity: .18; }
			62.3%     { opacity: 1;   }
			83%       { opacity: 1;   }
			83.4%     { opacity: .55; }
			84%, 100% { opacity: 1;   }
		}

		#title .sub {
			font-size: 13px; letter-spacing: .26em; color: #6d6659;
			text-transform: uppercase;
			animation: tbreathe 4.5s ease-in-out infinite;
		}
		@keyframes tbreathe { 0%,100%{opacity:.35} 50%{opacity:.85} }

		/* The two ways to play. Deliberately plain: this is a choice about how
		   punishing the dark is, not a difficulty boast, so neither is styled as
		   the recommended one. */
		/* The scare meter. Three segments that fill rather than three words in a
		   list, so the level reads as a quantity at a glance. The filled bars are
		   the whole affordance — the labels only name what the bars already say. */
		#fear { display:flex; gap:10px; z-index:2; flex-wrap:wrap; justify-content:center; margin:2px 0 10px; }
		#title .fl {
			appearance:none; cursor:pointer; text-align:left; width:212px;
			background:rgba(10,12,15,.5); border:1px solid #232220; padding:12px 14px;
			color:#6f6857; font-family:inherit;
			transition:border-color .22s ease, background .22s ease, color .22s ease;
		}
		#title .fl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#9c937f; margin:7px 0 4px; }
		#title .fl span { display:block; font-size:11px; line-height:1.5; color:#4d483f; }
		#title .fl .bars { display:flex; gap:3px; }
		#title .fl .bars s { display:block; width:26px; height:4px; background:#26251f; text-decoration:none; }
		#title .fl .bars s.on { background:#5d5544; }
		#title .fl:hover, #title .fl:focus-visible { border-color:#57503f; background:rgba(18,20,24,.7); outline:none; }
		#title .fl:hover b { color:#cbc0a6; }
		/* Chosen. The bars go warm so the selection is visible without colour alone. */
		#title .fl.sel { border-color:#8a7a52; background:rgba(28,25,18,.8); }
		#title .fl.sel b { color:#e8dcbc; }
		#title .fl.sel span { color:#726a5a; }
		#title .fl.sel .bars s.on { background:#c8a95f; }

		#modes {
			display: flex; gap: 14px; z-index: 2; flex-wrap: wrap;
			justify-content: center; margin: 4px 0 6px;
		}
		#title .mode {
			appearance: none; cursor: pointer; text-align: left;
			background: rgba(12,14,17,.55);
			border: 1px solid #2b2a26;
			padding: 14px 18px; max-width: 236px;
			color: #8a8375; font-family: inherit;
			transition: border-color .25s ease, color .25s ease, background .25s ease;
		}
		#title .mode b {
			display: block; font-size: 13px; letter-spacing: .18em;
			text-transform: uppercase; color: #b3aa98; margin-bottom: 6px;
		}
		#title .mode span {
			display: block; font-size: 12px; line-height: 1.55; color: #575146;
		}
		#title .mode:hover, #title .mode:focus-visible {
			border-color: #6d6455; color: #c9c0ad;
			background: rgba(20,23,27,.72); outline: none;
		}
		#title .mode:hover b, #title .mode:focus-visible b { color: #e2d8c2; }
		#title .mode:hover span, #title .mode:focus-visible span { color: #7d7566; }

		#title .keys {
			font-size: 12px; color: #46423b; line-height: 2.1;
			text-align: center; letter-spacing: .08em;
		}

		/* Darkness closing in. Driven from main.js by how long she has been
		   unlit — a vignette that tightens is the cheapest way to make the dark
		   feel like it is doing something rather than merely being dim. */
		#dark-vig {
			position: fixed; inset: 0; z-index: 4; pointer-events: none;
			opacity: 0; transition: opacity .8s linear;
			background: radial-gradient(ellipse at center,
				rgba(0,0,0,0) 24%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.92) 100%);
		}
		#title .twarn {
			position: absolute; bottom: 1.6rem; left: 50%;
			transform: translateX(-50%); z-index: 2;
			font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
			color: #3d3833;
		}
		#title.hidden { opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }

		/* ---- opening cutscene ---- */
		#cutscene {
			position: fixed; inset: 0; z-index: 20; background: #000;
			display: flex; align-items: center; justify-content: center;
			cursor: pointer; transition: opacity 1.8s ease;
		}
		#cutscene.done { opacity: 0; pointer-events: none; }
		#cutscene .cs-bg {
			position: absolute; inset: 0;
			background:
				radial-gradient(ellipse at 50% 120%, rgba(38,52,66,.55) 0%, transparent 62%),
				linear-gradient(180deg, #000 40%, #05080c 100%);
		}
		#cutscene .cs-text {
			position: relative; max-width: 30ch; padding: 0 2rem;
			text-align: center; font-size: clamp(1.05rem, 2.1vw, 1.5rem);
			line-height: 1.75; color: #b9b2a5; letter-spacing: .015em;
			opacity: 0; transition: opacity 1.5s ease;
		}
		#cutscene .cs-text.on { opacity: 1; }
		#cutscene .cs-text.cs-title {
			max-width: none; font-size: clamp(2.4rem, 8vw, 5rem);
			letter-spacing: .42em; text-indent: .42em; color: #9c958a;
		}
		#cutscene .cs-skip {
			position: absolute; bottom: 2.2rem; left: 50%; transform: translateX(-50%);
			font-size: 12px; letter-spacing: .12em; color: #4a463f; text-transform: uppercase;
			transition: opacity 2s ease;
		}
		#cutscene .cs-skip.faded { opacity: .28; }
		#cutscene .cs-skip b { color: #6b665c; font-weight: 400; }

		/* ---- note reader ---- */
		/* Left half is the note as an object; right half is the transcription.
		   The handwriting is genuinely hard to read, which is the point — the
		   transcript is what the player actually reads. */
		#note-reader {
			position: fixed; inset: 0; z-index: 15;
			display: flex; align-items: center; justify-content: center;
			opacity: 0; pointer-events: none; transition: opacity .35s ease;
		}
		#note-reader.on { opacity: 1; pointer-events: auto; }
		#note-reader .nr-scrim {
			position: absolute; inset: 0;
			background: radial-gradient(ellipse at center, rgba(0,0,0,.82) 0%, rgba(0,0,0,.96) 100%);
			backdrop-filter: blur(2px);
		}
		#note-reader .nr-panel {
			position: relative; display: grid; grid-template-columns: 1fr 1fr;
			gap: clamp(1rem, 4vw, 3.5rem); width: min(1180px, 92vw);
			max-height: 86vh; align-items: center;
		}
		#note-reader .nr-hand {
			font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script",
				"Brush Script MT", cursive;
			font-size: clamp(1rem, 1.7vw, 1.45rem); line-height: 1.85;
			color: #2a2115; white-space: pre-wrap; overflow: hidden;
			background: linear-gradient(150deg, #d9cfb4 0%, #cdc09f 45%, #b9ab88 100%);
			padding: clamp(1.4rem, 3vw, 2.6rem);
			box-shadow: 0 18px 60px rgba(0,0,0,.75), inset 0 0 60px rgba(90,70,40,.35);
			transform: rotate(-1.1deg); max-height: 78vh;
		}
		/* Typed and printed sources are not handwritten. */
		#note-reader .nr-hand.hand-typed {
			font-family: "Courier New", Courier, monospace;
			font-size: clamp(.8rem, 1.15vw, 1rem); line-height: 1.7;
			letter-spacing: .01em; transform: rotate(.7deg);
		}
		#note-reader .nr-hand.hand-print {
			font-family: "Iowan Old Style", Palatino, Georgia, serif;
			font-size: clamp(.85rem, 1.2vw, 1.05rem); line-height: 1.65;
			transform: rotate(.4deg);
			background: linear-gradient(160deg, #cfc7b2 0%, #bdb49a 100%);
		}
		#note-reader .nr-transcript {
			font-family: "Iowan Old Style", Palatino, Georgia, serif;
			color: #d6cfc0; max-height: 78vh; overflow-y: auto; padding-right: 1rem;
		}
		#note-reader .nr-num {
			font-family: "Iowan Old Style", Palatino, Georgia, serif;
			font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
			color: #6d6558; margin-bottom: .55rem;
		}
		#note-reader .nr-found {
			margin-top: 1.4rem; font-size: 12px; letter-spacing: .16em;
			text-transform: uppercase; color: #5c564c;
		}
		#note-reader .nr-transcript h2 {
			font-size: clamp(1.05rem, 1.5vw, 1.35rem); font-weight: 400;
			letter-spacing: .16em; text-transform: uppercase;
			color: #8f887a; margin-bottom: 1.4rem;
			border-bottom: 1px solid #3a352d; padding-bottom: .8rem;
		}
		#note-reader .nr-transcript pre {
			font-family: inherit; white-space: pre-wrap;
			font-size: clamp(.95rem, 1.35vw, 1.2rem); line-height: 1.85;
			color: #ded7c8;
		}
		#note-reader .nr-after {
			margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid #3a352d;
			font-style: italic; color: #9c8f7a;
			font-size: clamp(.9rem, 1.25vw, 1.1rem);
		}
		#note-reader .nr-close {
			margin-top: 2.2rem; font-size: 12px; letter-spacing: .14em;
			text-transform: uppercase; color: #55504a;
		}
		#note-reader .nr-close b { color: #7d766a; font-weight: 400; }
		@media (max-width: 860px) {
			#note-reader .nr-panel { grid-template-columns: 1fr; }
			#note-reader .nr-hand { display: none; }
		}
	
		#ending {
			position: fixed; inset: 0; z-index: 40; background: #050608;
			display: flex; flex-direction: column; align-items: center;
			justify-content: center; gap: 2rem; padding: 6vh 8vw;
			opacity: 0; transition: opacity 3s ease; overflow-y: auto;
		}
		#ending.on { opacity: 1; }
		#ending h1 {
			font-size: clamp(1.4rem, 3vw, 2.1rem); font-weight: 400;
			letter-spacing: .5em; text-indent: .5em; color: #8e8779;
		}
		#ending pre {
			font-family: "Iowan Old Style", Palatino, Georgia, serif;
			white-space: pre-wrap; max-width: 60ch; text-align: left;
			font-size: clamp(1rem, 1.5vw, 1.2rem); line-height: 1.9; color: #cfc8b9;
		}
		#ending .e-end {
			margin-top: 2rem; font-size: 12px; letter-spacing: .42em;
			text-indent: .42em; color: #4a463f;
		}
	</style>

<body>
	<div id="hud">
		<div id="vignette"></div>
		<div id="dark-vig"></div>
		<div id="prompt"></div>
		<div id="subtitle"></div>
		<div id="fade"></div>
	</div>

	<div id="title">
		<canvas class="tbg"></canvas>
		<div class="tvig"></div>
		<h1>SALTMERE</h1>
		<div class="sub">How frightening should it be</div>
		<div id="fear">
			<button class="fl" data-fear="unsettled">
				<i class="bars"><s class="on"></s><s></s><s></s></i>
				<b>Unsettled</b><span>Atmosphere and story. Nothing lunges at you.</span>
			</button>
			<button class="fl sel" data-fear="haunted">
				<i class="bars"><s class="on"></s><s class="on"></s><s></s></i>
				<b>Haunted</b><span>The house is against you.</span>
			</button>
			<button class="fl" data-fear="saltmere">
				<i class="bars"><s class="on"></s><s class="on"></s><s class="on"></s></i>
				<b>Saltmere</b><span>Everything, sooner, and closer.</span>
			</button>
		</div>
		<div class="sub">And how the torch works</div>
		<div id="modes">
			<button class="mode" data-mode="drain">
				<b>Failing torch</b>
				<span>The cell runs down. Spares are somewhere in the house.</span>
			</button>
			<button class="mode" data-mode="infinite">
				<b>Steady torch</b>
				<span>The light never fails. Explore without watching the charge.</span>
			</button>
		</div>
		<div class="keys">
			WASD move &nbsp;·&nbsp; Shift run &nbsp;·&nbsp; C crouch<br />
			E interact &nbsp;·&nbsp; F torch &nbsp;·&nbsp; R change cell &nbsp;·&nbsp; Esc release cursor<br />
			<span style="color:#3a3733">Headphones recommended</span>
		</div>
		<div class="twarn">Contains sustained darkness and loud sound</div>
	</div>

	<script>
	// Title background: black water, moving light on it, and something at the
	// far edge that surfaces about once a minute and is gone before you are
	// sure. Deliberately never fully resolved — the moment it is a clear shape
	// it stops being frightening and starts being a picture of a ghost.
	(function () {
		const c = document.querySelector('#title canvas.tbg');
		if (!c) return;
		const x = c.getContext('2d');
		let W, H;
		const fit = () => {
			W = c.width = Math.floor(innerWidth * Math.min(devicePixelRatio, 2));
			H = c.height = Math.floor(innerHeight * Math.min(devicePixelRatio, 2));
		};
		fit(); addEventListener('resize', fit);

		// Drifting motes — dust, or silt in water.
		const motes = Array.from({ length: 90 }, () => ({
			x: Math.random(), y: Math.random(),
			r: 0.4 + Math.random() * 1.6,
			s: 0.00004 + Math.random() * 0.00016,
			a: 0.04 + Math.random() * 0.16,
		}));

		let grainTick = 0;
		let t = 0;
		let nextFace = 9 + Math.random() * 14;
		let faceT = -99;
		let raf = 0;
		let stopped = false;

		// The game calls this the moment play begins. Without it the loop below
		// keeps running forever behind the hidden title screen, doing a full
		// getImageData/putImageData over ~3.7 MILLION pixels every frame — about
		// 4.5ms, which is a quarter of the frame budget spent on a screen nobody
		// is looking at.
		window.__stopTitleFX = function () {
			stopped = true;
			if (raf) cancelAnimationFrame(raf);
			c.width = c.height = 1;
		};

		function frame() {
			if (stopped) return;
			raf = requestAnimationFrame(frame);
			t += 1 / 60;

			x.fillStyle = '#04060a';
			x.fillRect(0, 0, W, H);

			// Slow caustic bands: light off water on a ceiling.
			for (let i = 0; i < 5; i++) {
				const yy = H * (0.18 + i * 0.17) + Math.sin(t * 0.22 + i) * H * 0.05;
				const g = x.createLinearGradient(0, yy - H * 0.16, 0, yy + H * 0.16);
				g.addColorStop(0, 'rgba(30,52,66,0)');
				g.addColorStop(0.5, `rgba(46,74,90,${0.05 + 0.035 * Math.sin(t * 0.5 + i * 2)})`);
				g.addColorStop(1, 'rgba(30,52,66,0)');
				x.fillStyle = g;
				x.fillRect(0, yy - H * 0.16, W, H * 0.32);
			}

			for (const m of motes) {
				m.y -= m.s;
				if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); }
				x.fillStyle = `rgba(150,168,180,${m.a})`;
				x.beginPath();
				x.arc(m.x * W, m.y * H, m.r * (W / 1400), 0, Math.PI * 2);
				x.fill();
			}

			// The thing at the back.
			if (t > nextFace) { faceT = 0; nextFace = t + 26 + Math.random() * 30; }
			if (faceT >= 0) {
				faceT += 1 / 60;
				const k = faceT / 3.4;
				if (k >= 1) { faceT = -99; }
				else {
					// Rises, hangs, sinks. Never brighter than a smudge.
					const env = Math.sin(k * Math.PI);
					const cx = W * 0.5, cy = H * (0.62 - env * 0.13);
					const r = W * 0.055;
					const g = x.createRadialGradient(cx, cy, 2, cx, cy, r * 3.4);
					g.addColorStop(0, `rgba(176,182,180,${0.15 * env})`);
					g.addColorStop(0.45, `rgba(120,132,136,${0.07 * env})`);
					g.addColorStop(1, 'rgba(0,0,0,0)');
					x.fillStyle = g;
					x.beginPath(); x.arc(cx, cy, r * 3.4, 0, Math.PI * 2); x.fill();

					// Two darker hollows where eyes would be. No mouth, no outline.
					x.fillStyle = `rgba(4,7,10,${0.28 * env})`;
					x.beginPath();
					x.ellipse(cx - r * 0.42, cy - r * 0.10, r * 0.19, r * 0.12, 0, 0, Math.PI * 2);
					x.ellipse(cx + r * 0.42, cy - r * 0.10, r * 0.19, r * 0.12, 0, 0, Math.PI * 2);
					x.fill();
				}
			}

			// Film grain, every other frame and at a coarse stride. A full-res
			// grain pass each frame costs more than the rest of the title
			// screen put together.
			if ((grainTick = (grainTick + 1) % 2) === 0) {
				const img = x.getImageData(0, 0, W, H);
				const d = img.data;
				for (let i = 0; i < d.length; i += 32) {
					const n = (Math.random() - 0.5) * 26;
					d[i] += n; d[i + 1] += n; d[i + 2] += n;
				}
				x.putImageData(img, 0, 0);
			}
		}
		frame();
	})();
	</script>
