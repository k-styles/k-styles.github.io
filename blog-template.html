<!DOCTYPE html>
<!-- ============================================================
  HOW TO WRITE A NEW POST
  1. Copy this file to blog-your-title.html
  2. Fill in the <title>, h1, and meta line below
  3. Write your post inside <article> ... </article>.
     Building blocks you can use:
       <p class="lead">opening line</p>
       <h2>Section</h2>   <h3>Sub-section</h3>
       <p>paragraph with <a href="...">links</a>, <em>italics</em>, <strong>bold</strong></p>
       <ul><li>bullet</li></ul>   <ol><li>step</li></ol>
       <blockquote>quote</blockquote>   <blockquote class="def">key fact</blockquote>
       <code>inline code</code>
       <div class="formula">E = sum_i J_ij s_i s_j</div>
       <div class="figure-note">[ figure goes here ]</div>
  4. Add an <li> linking to it in the right list in blogs.html

  All styling lives in blog.css. Do not paste a <style> block in here:
  if a post needs a new visual, add it to blog.css so every post gets it.
  ============================================================ -->
